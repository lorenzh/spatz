name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/release-version.ts "$RELEASE_TAG"

  build:
    needs: version
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ github.sha }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          bun -e 'const { createHash } = require("node:crypto"); for (const line of (await Bun.file("SHA256SUMS").text()).trim().split("\n")) { const [expected, file] = line.split(/\s+/, 2); const actual = createHash("sha256").update(await Bun.file(file).bytes()).digest("hex"); if (actual !== expected) throw new Error(`Checksum failed: ${file}`); }'
          flags=()
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          mapfile -t assets < <(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -print | sort)
          gh release create "$RELEASE_TAG" "${assets[@]}" SHA256SUMS \
            --verify-tag --generate-notes --title "$RELEASE_TAG" "${flags[@]}"
