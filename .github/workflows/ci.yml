name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPATZ_NO_JEV: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - name: Install DuckDB SQLite extension for offline tests
        run: |
          bun packages/cli/src/cli.ts 'ci setup' --models gpt-6-luna --dry-run
          bun packages/cli/src/cli.ts stats
      - run: bun test
      - run: bun run typecheck
      - run: bun run lint
