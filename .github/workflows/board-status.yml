# Keeps the Status of the "spatz dev board" project (user lorenzh, number 4) in sync.
# The same file lives in each repo that uses the board.
#
#   issue closed                -> Done
#   issue reopened              -> Ready
#   branch <prefix>/<N>-<slug> created, PR opened/reopened/ready/draft/closed:
#     for each issue the PR closes (or the branch names), from its current state:
#     closed -> Done; open non-draft PR -> In review; open draft PR -> In progress;
#     branch <prefix>/<N>-<slug> exists -> In progress; else -> Backlog
#   An open issue with a manual Status outside this chain (e.g. Blocked) keeps it.
#
# Acts only for actors with write, maintain or admin on this repo (issue/branch: sender,
# PR: author). Fork PRs get no secret and skip. The managing-spatz-projects board-sync
# is the backstop for everything this workflow skips.
# Needs the BOARD_TOKEN secret: a fine-grained PAT for this repository only, with
# Projects read/write on the user account and Issues + Pull requests read on this repo.
# Without it, the job exits 0.
#
# Known limits (the managing-spatz-projects board-sync corrects all of them):
# - Fork PRs are not updated automatically.
# - Concurrent events on different branches can race; the last write wins.
# - The 10-target cap applies the first 10 linked issues and lists the rest.
# - Cross-repo refs need a token that can read the other repo; otherwise they are skipped with a warning.
# - Issue reopened sets Ready even with open blockers.
name: Board status

on:
  create:
  pull_request:
    types: [opened, reopened, ready_for_review, converted_to_draft, closed]
  issues:
    types: [closed, reopened]

permissions:
  contents: read

# Branch and PR runs for the same branch share a group; every write re-reads current state.
concurrency:
  group: board-status-${{ github.event.issue.number || github.event.pull_request.head.ref || github.event.ref }}
  cancel-in-progress: false

jobs:
  status:
    if: github.event_name != 'create' || github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}
        with:
          script: |
            const OWNER = 'lorenzh';
            const NUMBER = 4;
            const MAX_TARGETS = 10;
            const STATUSES = ['Backlog', 'Ready', 'In progress', 'In review', 'Done'];
            const WRITERS = ['admin', 'maintain', 'write'];
            const p = context.payload;
            const pr = p.pull_request;
            const { owner, repo } = context.repo;
            const here = `${owner}/${repo}`;

            if (pr && pr.head.repo?.full_name !== here) {
              core.notice('Fork PR: no board token; board-sync updates the Status.');
              return;
            }
            if (!process.env.BOARD_TOKEN) {
              core.notice('BOARD_TOKEN is not set; board status not updated.');
              return;
            }
            const actor = pr ? pr.user.login : p.sender.login;
            let perm;
            try {
              perm = (await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: actor })).data;
            } catch (e) {
              core.setFailed(`Permission check for ${actor} failed: ${e.message}`);
              return;
            }
            if (![perm.role_name, perm.permission].some((r) => WRITERS.includes(r))) {
              core.notice(`${actor} has no write access here; board status not updated.`);
              return;
            }
            const board = getOctokit(process.env.BOARD_TOKEN).graphql;

            // Positive GraphQL Int without zero padding, else null.
            const num = (s) => (/^[1-9]\d{0,9}$/.test(s ?? '') && Number(s) < 2 ** 31 ? Number(s) : null);
            const branchIssue = (name) => num(name.match(/^[^/]+\/(\d+)-/)?.[1]);

            // Follows pageInfo to the end, or until done(nodes) is true.
            async function pages(client, query, vars, conn, done = () => false) {
              const nodes = [];
              let after = null;
              do {
                const c = conn(await client(query, { ...vars, after }));
                nodes.push(...c.nodes);
                if (done(nodes)) break;
                after = c.pageInfo.hasNextPage ? c.pageInfo.endCursor : null;
              } while (after);
              return nodes;
            }

            const ISSUE = `fragment I on Issue { id number state
              repository { nameWithOwner isPrivate owner { login } }
              projectItems(first: 50) { nodes { id project { id }
                status: fieldValueByName(name: "Status") { ... on ProjectV2ItemFieldSingleSelectValue { name } } } } }`;

            async function getIssue(full, n) {
              const [o, r] = full.split('/');
              let res;
              try {
                res = await board(
                  `query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){issueOrPullRequest(number:$n){__typename ...I}}} ${ISSUE}`,
                  { o, r, n },
                );
              } catch (e) {
                // Missing or unreadable (e.g. another repo the token cannot see): skip, not fail.
                if (!e.errors?.length || !e.errors.every((x) => x.type === 'NOT_FOUND')) throw e;
                core.warning(`${full}#${n} not found or not readable; skipped.`);
                return null;
              }
              const node = res.repository?.issueOrPullRequest;
              return node?.__typename === 'Issue' ? node : null;
            }

            const { user } = await board(
              `query($login:String!,$n:Int!){user(login:$login){projectV2(number:$n){id field(name:"Status"){... on ProjectV2SingleSelectField{id options{id name}}}}}}`,
              { login: OWNER, n: NUMBER },
            );
            const project = user.projectV2;
            if (!project?.field?.options) throw new Error(`Project ${OWNER}/${NUMBER} or its Status field not found`);

            let boardRepos;
            async function allowed(issue) {
              const r = issue.repository;
              if (r.nameWithOwner === here) return true;
              if (r.owner.login !== owner || (!p.repository.private && r.isPrivate)) return false;
              boardRepos ??= new Set(
                (
                  await pages(
                    board,
                    `query($id:ID!,$after:String){node(id:$id){... on ProjectV2{items(first:100,after:$after){pageInfo{hasNextPage endCursor} nodes{content{... on Issue{repository{nameWithOwner}} ... on PullRequest{repository{nameWithOwner}}}}}}}}`,
                    { id: project.id },
                    (x) => x.node.items,
                  )
                ).map((i) => i.content?.repository?.nameWithOwner),
              );
              return boardRepos.has(r.nameWithOwner);
            }

            // Uses the workflow token; the PAT needs no Contents access.
            async function branchExists(issue) {
              const [o, r] = issue.repository.nameWithOwner.split('/');
              const match = (nodes) => nodes.some((b) => branchIssue(b.name) === issue.number);
              const nodes = await pages(
                github.graphql,
                `query($o:String!,$r:String!,$q:String!,$after:String){repository(owner:$o,name:$r){refs(refPrefix:"refs/heads/",query:$q,first:100,after:$after){pageInfo{hasNextPage endCursor} nodes{name}}}}`,
                { o, r, q: `/${issue.number}-` },
                (x) => x.repository.refs,
                match,
              );
              return match(nodes);
            }

            // Status from current state; cur is the triggering PR as just re-read.
            async function derive(issue, cur) {
              if (issue.state === 'CLOSED') return 'Done';
              const [o, r] = issue.repository.nameWithOwner.split('/');
              const prs = await pages(
                board,
                `query($o:String!,$r:String!,$n:Int!,$after:String){repository(owner:$o,name:$r){issue(number:$n){closedByPullRequestsReferences(first:50,after:$after,includeClosedPrs:false){pageInfo{hasNextPage endCursor} nodes{id state isDraft}}}}}`,
                { o, r, n: issue.number },
                (x) => x.repository.issue.closedByPullRequestsReferences,
              );
              const open = prs.filter((x) => x.state === 'OPEN' && x.id !== cur?.id);
              if (cur?.state === 'OPEN') open.push(cur);
              if (open.some((x) => !x.isDraft)) return 'In review';
              if (open.length) return 'In progress';
              return (await branchExists(issue)) ? 'In progress' : 'Backlog';
            }

            async function setStatus(issue, status) {
              const option = project.field.options.find((o) => o.name === status);
              if (!STATUSES.includes(status) || !option) throw new Error(`Status "${status}" is not a board option`);
              const item = issue.projectItems.nodes.find((i) => i.project.id === project.id);
              if (item?.status?.name === status) return core.info(`#${issue.number} already ${status}`);
              // A manual Status outside the chain (e.g. Blocked) stays until the issue closes.
              if (item?.status?.name && !STATUSES.includes(item.status.name) && issue.state === 'OPEN') {
                return core.notice(`#${issue.number} has manual Status "${item.status.name}"; not changed.`);
              }
              const id =
                item?.id ??
                (
                  await board(
                    `mutation($p:ID!,$c:ID!){addProjectV2ItemById(input:{projectId:$p,contentId:$c}){item{id}}}`,
                    { p: project.id, c: issue.id },
                  )
                ).addProjectV2ItemById.item.id;
              await board(
                `mutation($p:ID!,$i:ID!,$f:ID!,$o:String!){updateProjectV2ItemFieldValue(input:{projectId:$p,itemId:$i,fieldId:$f,value:{singleSelectOptionId:$o}}){projectV2Item{id}}}`,
                { p: project.id, i: id, f: project.field.id, o: option.id },
              );
              core.info(`${issue.repository.nameWithOwner}#${issue.number} -> ${status}`);
            }

            // Targets: { issue } (already loaded) or { full, n } (looked up per target).
            let targets = [];
            let cur = null;
            let pick = (issue) => derive(issue, cur);
            if (context.eventName === 'issues') {
              targets = [{ full: here, n: p.issue.number }];
              pick = (issue) => {
                const want = p.action === 'closed' ? 'CLOSED' : 'OPEN';
                if (issue.state !== want) return null; // stale event
                return want === 'CLOSED' ? 'Done' : 'Ready';
              };
            } else if (context.eventName === 'create') {
              const n = branchIssue(p.ref);
              if (n) targets = [{ full: here, n }];
            } else {
              const res = await board(
                `query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){id state isDraft body}}}`,
                { o: owner, r: repo, n: pr.number },
              );
              cur = res.repository.pullRequest;
              const closing = await pages(
                board,
                `query($o:String!,$r:String!,$n:Int!,$after:String){repository(owner:$o,name:$r){pullRequest(number:$n){closingIssuesReferences(first:50,after:$after){pageInfo{hasNextPage endCursor} nodes{...I}}}}} ${ISSUE}`,
                { o: owner, r: repo, n: pr.number },
                (x) => x.repository.pullRequest.closingIssuesReferences,
              );
              targets = closing.map((issue) => ({ issue }));
              // Body refs cover stacked PRs, whose closing references stay empty. Read the current
              // body, not the event's; fenced and inline code is skipped.
              const body = (cur.body ?? '').replace(/(```|~~~)[\s\S]*?\1/g, '').replace(/`[^`\n]*`/g, '');
              const keyword = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+([\w.-]+\/[\w.-]+)?#(\d+)\b/gi;
              for (const [, full, n] of body.matchAll(keyword)) {
                if (num(n)) targets.push({ full: full ?? here, n: num(n) });
              }
            }

            const seen = new Set();
            const key = (t) => (t.issue ? `${t.issue.repository.nameWithOwner}#${t.issue.number}` : `${t.full}#${t.n}`).toLowerCase();
            targets = targets.filter((t) => !seen.has(key(t)) && seen.add(key(t)));
            if (targets.length > MAX_TARGETS) {
              core.warning(`Skipped ${targets.slice(MAX_TARGETS).map(key).join(', ')}: more than ${MAX_TARGETS} issues.`);
              targets = targets.slice(0, MAX_TARGETS);
            }

            const errors = [];
            for (const t of targets) {
              try {
                const issue = t.issue ?? (await getIssue(t.full, t.n));
                if (!issue) {
                  core.info(`${key(t)} is not an issue; skipped.`);
                } else if (!(await allowed(issue))) {
                  core.info(`${key(t)} is not on a repo this workflow may update; skipped.`);
                } else {
                  const status = await pick(issue);
                  if (status) await setStatus(issue, status);
                  else core.info(`${key(t)} changed since the event; skipped.`);
                }
              } catch (e) {
                errors.push(`${key(t)}: ${e.message}`);
                core.warning(`${key(t)}: ${e.message}`);
              }
            }
            if (errors.length) core.setFailed(`Board status failed for ${errors.join('; ')}`);
