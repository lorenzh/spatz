name: Harness catalog

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-catalog
  cancel-in-progress: false

jobs:
  extract:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Every job uses the commit this run started on, so publish ships what test checked.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - name: Extract published harness catalogs
        run: bun scripts/harness-catalog.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harness-catalog
          path: catalog/harness-models.json
          if-no-files-found: error

  test:
    # Dev dependencies are third-party code, so the tests run without write access.
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      SPATZ_NO_JEV: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Every job uses the commit this run started on, so publish ships what test checked.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: harness-catalog
          path: ${{ runner.temp }}/harness-catalog
      - name: Validate and copy the catalog
        id: validate
        run: bun scripts/accept-harness-catalog.ts "$RUNNER_TEMP/harness-catalog/harness-models.json" catalog/harness-models.json
      - run: bun install --frozen-lockfile
      - name: Run the tests in a temporary home
        run: HOME="$(mktemp -d)" bun test

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Every job uses the commit this run started on, so publish ships what test checked.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: harness-catalog
          path: ${{ runner.temp }}/harness-catalog
      - name: Validate and copy the catalog
        id: validate
        run: bun scripts/accept-harness-catalog.ts "$RUNNER_TEMP/harness-catalog/harness-models.json" catalog/harness-models.json
      - name: Commit through a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # The tests ran on GITHUB_SHA, so merge only onto that base. A moved main needs a new run.
          # ponytail: main can still move between this check and the merge; a merge queue closes that window.
          require_tested_base() {
            if [[ "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" != "$GITHUB_SHA" ]]; then
              echo "::error::main moved after the tests ran on $GITHUB_SHA. Run the workflow again to test the new main."
              exit 1
            fi
          }
          today="$(date -u +%Y%m%d)"
          branch="catalog/update-$today"
          stale="$(gh pr list --base main --state open --author 'github-actions[bot]' --limit 1000 \
            --json number,headRefName,isCrossRepository \
            --jq '.[] | select(.isCrossRepository == false) | [.number, .headRefName] | @tsv')"
          while IFS=$'\t' read -r number head; do
            if [[ "$head" =~ ^catalog/update-([0-9]{8})$ ]] && [[ "${BASH_REMATCH[1]}" < "$today" ]]; then
              gh pr close "$number" --delete-branch
            fi
          done <<< "$stale"
          if git diff --quiet -- catalog/harness-models.json; then exit 0; fi
          require_tested_base
          gh auth setup-git
          # Fetch the remote tip before using a lease when today's branch exists.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
          fi
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/harness-models.json
          git commit -m 'chore(catalog): update harness models'
          git push --force-with-lease origin "$branch"
          pr="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr" ]]; then
            pr="$(gh pr create --base main --head "$branch" \
              --title 'chore(catalog): update harness models' \
              --body 'Refresh the model catalog from the latest published Claude Code and Codex versions. The extractor validates both harnesses before writing this file.')"
          fi
          require_tested_base
          gh pr merge "$pr" --merge --delete-branch

  prices:
    # Reports differences between catalog/official-prices.json and OpenRouter; never changes the table.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - name: Compare official prices with OpenRouter
        run: bun scripts/price-check.ts

  report:
    needs: [extract, test, publish]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open an issue after three failed runs in a row
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # This run is still in progress, so it is not in the completed list.
          failed="$(gh run list --workflow harness-catalog.yml --branch main --status completed --limit 2 \
            --json conclusion --jq '[.[] | select(.conclusion == "failure")] | length')"
          if [[ "$failed" -lt 2 ]]; then exit 0; fi
          title='Harness catalog workflow failed three runs in a row'
          if gh issue list --state open --limit 1000 --json title --jq '.[].title' | grep -Fxq "$title"; then
            exit 0
          fi
          gh issue create --title "$title" --body "The daily harness catalog workflow failed three runs in a row, so installed CLIs keep the old catalog. Latest run: $RUN_URL. See RELEASING.md#daily-harness-catalog."
