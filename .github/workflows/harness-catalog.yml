name: Harness catalog

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-catalog
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.0'
      - name: Extract published harness catalogs
        run: bun scripts/harness-catalog.ts
      - name: Commit through a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if git diff --quiet -- catalog/harness-models.json; then exit 0; fi
          branch="catalog/update-$(date -u +%Y%m%d)"
          gh auth setup-git
          # Fetch the remote tip before using a lease when today's branch exists.
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
          fi
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/harness-models.json
          git commit -m 'chore(catalog): update harness models'
          git push --force-with-lease origin "$branch"
          pr="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$pr" ]]; then
            pr="$(gh pr create --base main --head "$branch" \
              --title 'chore(catalog): update harness models' \
              --body 'Refresh the model catalog from the latest published Claude Code and Codex versions. The extractor validates both harnesses before writing this file.')"
          fi
          gh pr merge "$pr" --merge --delete-branch
